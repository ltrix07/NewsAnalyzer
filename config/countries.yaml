# ISO 3166-1 alpha-2 codes match sources.country. Residence coverage is determined independently
# from enabled entries in sources.yaml. ZZ is the sentinel for unrecognized free text.
countries:
  PL:
    labels: {ru: "Польша", en: "Poland"}
    aliases: [poland, polska, польша]
    legal_status_options:
      - ["work permit", "Work permit"]
      - ["karta pobytu", "Karta pobytu"]
      - ["studies", "Studies"]
      - ["citizen", "Citizen"]
      - ["n-a", "N/A / Пропустить"]
    residence_prompt_slots:
      residence_and_work_terms: ["karta pobytu", "work permit"]
      migration_policy_terms: ["cudzoziemcy", "szybka ścieżka"]
      central_bank: "NBP"
      currency: "PLN"
      financial_regulator: "KNF"
      bilateral_topics:
        - border / transit issues
        - Polish military, financial, and humanitarian aid to Ukraine
        - UPA / OUN / Wołyń historical-political disputes
  DE:
    labels: {ru: "Германия", en: "Germany"}
    aliases: [germany, deutschland, германия]
    legal_status_options: []
    residence_prompt_slots: {}
  CZ:
    labels: {ru: "Чехия", en: "Czechia"}
    aliases: [czechia, "czech republic", česko, чехия]
    legal_status_options: []
    residence_prompt_slots: {}
  IT:
    labels: {ru: "Италия", en: "Italy"}
    aliases: [italy, italia, италия]
    legal_status_options: []
    residence_prompt_slots: {}
  ES:
    labels: {ru: "Испания", en: "Spain"}
    aliases: [spain, españa, испания]
    legal_status_options: []
    residence_prompt_slots: {}
